<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #38bdf8);
            --button-text: var(--tg-theme-button-text-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 10px 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint-color);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--hint-color);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
        }

        input[type="text"], input[type="range"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--button-color);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:active, .tool-btn.active {
            background: var(--accent-gradient);
            color: #0f172a;
            border-color: transparent;
            transform: scale(0.97);
        }

        .tool-btn .icon {
            font-size: 20px;
        }

        .badge-list {
            display: flex;
            gap: 8px;
        }

        .badge-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .badge-btn.active {
            background: var(--button-color);
            color: var(--button-text);
            border-color: transparent;
        }

        .submit-btn {
            background: var(--accent-gradient);
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: transform 0.15s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .preview-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            color: var(--hint-color);
            text-align: center;
            font-size: 13px;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 Video Studio</h1>
        <p>Панель быстрого монтажа и экспорта</p>
    </div>

    <!-- Обрезка таймкода -->
    <div class="card">
        <div class="card-title">✂️ Обрезка по времени</div>
        <div class="grid-2">
            <div class="input-group">
                <label>Начало</label>
                <input type="text" id="trimStart" placeholder="0:00" value="0:00">
            </div>
            <div class="input-group">
                <label>Конец</label>
                <input type="text" id="trimEnd" placeholder="0:30" value="0:30">
            </div>
        </div>
    </div>

    <!-- Разрешение и качество -->
    <div class="card">
        <div class="card-title">📦 Качество видео</div>
        <div class="badge-list">
            <div class="badge-btn active" onclick="selectQuality(this, '720')">720p HD</div>
            <div class="badge-btn" onclick="selectQuality(this, '480')">480p SD</div>
            <div class="badge-btn" onclick="selectQuality(this, '360')">360p Eco</div>
        </div>
    </div>

    <!-- Текст внизу -->
    <div class="card">
        <div class="card-title">✍️ Текст на видео</div>
        <div class="input-group" style="margin-bottom: 0;">
            <input type="text" id="captionText" placeholder="Например: Подпишись @mychannel">
        </div>
    </div>

    <!-- Удаление водяного знака -->
    <div class="card">
        <div class="card-title">✨ Удалить знак в углу</div>
        <div class="grid-4">
            <div class="tool-btn" onclick="selectDelogo(this, 'tl')">
                <span class="icon">↖️</span>
                <span>Слева вверху</span>
            </div>
            <div class="tool-btn" onclick="selectDelogo(this, 'tr')">
                <span class="icon">↗️</span>
                <span>Справа вверху</span>
            </div>
            <div class="tool-btn" onclick="selectDelogo(this, 'bl')">
                <span class="icon">↙️</span>
                <span>Слева внизу</span>
            </div>
            <div class="tool-btn active" onclick="selectDelogo(this, 'br')">
                <span class="icon">↘️</span>
                <span>Справа внизу</span>
            </div>
        </div>
    </div>

    <button class="submit-btn" onclick="sendToBot()">Применить в боте ⚡</button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let selectedQuality = "720";
        let selectedDelogoPos = "br";

        function selectQuality(elem, q) {
            document.querySelectorAll('.badge-btn').forEach(b => b.classList.remove('active'));
            elem.classList.add('active');
            selectedQuality = q;
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function selectDelogo(elem, pos) {
            const isSame = elem.classList.contains('active');
            document.querySelectorAll('.grid-4 .tool-btn').forEach(b => b.classList.remove('active'));
            if (!isSame) {
                elem.classList.add('active');
                selectedDelogoPos = pos;
            } else {
                selectedDelogoPos = null;
            }
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function sendToBot() {
            const data = {
                trim: document.getElementById('trimStart').value + '-' + document.getElementById('trimEnd').value,
                quality: selectedQuality,
                caption: document.getElementById('captionText').value.trim(),
                delogo: selectedDelogoPos
            };

            if (tg) {
                tg.sendData(JSON.stringify(data));
                tg.close();
            } else {
                alert("Данные для отправки:\n" + JSON.stringify(data, null, 2));
            }
        }
    </script>
</body>
</html>
