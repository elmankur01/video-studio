<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Studio Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #090d16);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #131b2e);
            --card-bg: rgba(26, 36, 59, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-active: rgba(56, 189, 248, 0.45);
            
            --text-main: var(--tg-theme-text-color, #f8fafc);
            --text-muted: var(--tg-theme-hint-color, #94a3b8);
            --accent-cyan: #38bdf8;
            --accent-indigo: #818cf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --accent-glow: 0 0 20px rgba(56, 189, 248, 0.25);
            
            --success: #34d399;
            --danger: #f87171;
            
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-pill: 9999px;
            
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: var(--font-stack);
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 20px));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--accent-glow);
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chip {
            padding: 5px 10px;
            border-radius: var(--radius-pill);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Card Section */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: border-color 0.2s ease, transform 0.15s ease;
        }

        .card:focus-within {
            border-color: var(--card-border-active);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .card-title svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent-cyan);
        }

        /* Inputs */
        .inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-box label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        /* Quality Segmented Control */
        .segmented-control {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            gap: 4px;
        }

        .segment-btn {
            flex: 1;
            padding: 10px 8px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .segment-btn.active {
            background: var(--accent-gradient);
            color: #090d16;
            font-weight: 700;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        /* Corners Grid for Delogo */
        .corner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .corner-btn {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .corner-btn.active {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--accent-cyan);
            color: var(--text-main);
        }

        .corner-indicator {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: all 0.2s;
        }

        .corner-btn.active .corner-indicator {
            background: var(--accent-cyan);
            color: #090d16;
            border-color: transparent;
            font-weight: bold;
        }

        /* Submit Button */
        .action-container {
            margin-top: auto;
            padding-top: 8px;
        }

        .btn-apply {
            width: 100%;
            border: none;
            border-radius: var(--radius-lg);
            background: var(--accent-gradient);
            color: #090d16;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(56, 189, 248, 0.35);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s;
        }

        .btn-apply:active {
            transform: scale(0.975);
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
        }

        .btn-apply svg {
            width: 18px;
            height: 18px;
            stroke: #090d16;
            stroke-width: 2.4;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon">🎬</div>
            <div class="brand-text">
                <h1>Video Studio Pro</h1>
                <p>Панель быстрого монтажа</p>
            </div>
        </div>
        <div class="chip">Telegram Native</div>
    </div>

    <!-- 1. Обрезка -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
                Интервал обрезки
            </div>
        </div>
        <div class="inputs-row">
            <div class="input-box">
                <label>Старт (ММ:СС)</label>
                <input type="text" id="trimStart" placeholder="Опционально, напр. 0:05" inputmode="decimal">
            </div>
            <div class="input-box">
                <label>Финиш (ММ:СС)</label>
                <input type="text" id="trimEnd" placeholder="Опционально, напр. 0:30" inputmode="decimal">
            </div>
        </div>
    </div>

    <!-- 2. Разрешение -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                Выходное качество
            </div>
        </div>
        <div class="segmented-control">
            <button class="segment-btn active" onclick="setQuality(this, '720')">720p HD</button>
            <button class="segment-btn" onclick="setQuality(this, '480')">480p SD</button>
            <button class="segment-btn" onclick="setQuality(this, '360')">360p Eco</button>
        </div>
    </div>

    <!-- 3. Наложение текста -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                Текст / Титры внизу
            </div>
        </div>
        <input type="text" id="captionText" placeholder="Например: Мой блог @channel">
    </div>

    <!-- 4. Удаление водяного знака -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Удаление водяного знака
            </div>
        </div>
        <div class="corner-grid">
            <div class="corner-btn" onclick="toggleCorner(this, 'tl')">
                <div class="corner-indicator">↖</div>
                <span>Сверху слева</span>
            </div>
            <div class="corner-btn" onclick="toggleCorner(this, 'tr')">
                <div class="corner-indicator">↗</div>
                <span>Сверху справа</span>
            </div>
            <div class="corner-btn" onclick="toggleCorner(this, 'bl')">
                <div class="corner-indicator">↙</div>
                <span>Снизу слева</span>
            </div>
            <div class="corner-btn active" onclick="toggleCorner(this, 'br')">
                <div class="corner-indicator">✓</div>
                <span>Снизу справа</span>
            </div>
        </div>
    </div>

    <!-- Action -->
    <div class="action-container">
        <button class="btn-apply" onclick="applyChanges()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Применить в боте
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let currentQuality = "720";
        let currentDelogo = "br";

        function setQuality(btn, q) {
            document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentQuality = q;
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function toggleCorner(btn, pos) {
            const isAlreadyActive = btn.classList.contains('active');
            document.querySelectorAll('.corner-btn').forEach(b => {
                b.classList.remove('active');
                b.querySelector('.corner-indicator').textContent = b.querySelector('.corner-indicator').getAttribute('data-default') || b.querySelector('.corner-indicator').textContent.replace('✓', getArrow(b));
            });

            if (!isAlreadyActive) {
                btn.classList.add('active');
                btn.querySelector('.corner-indicator').textContent = '✓';
                currentDelogo = pos;
            } else {
                currentDelogo = null;
            }
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function getArrow(b) {
            const txt = b.textContent;
            if (txt.includes('слева') && txt.includes('Сверху')) return '↖';
            if (txt.includes('справа') && txt.includes('Сверху')) return '↗';
            if (txt.includes('слева') && txt.includes('Снизу')) return '↙';
            return '↘';
        }

        function applyChanges() {
            const startVal = document.getElementById('trimStart').value.trim();
            const endVal = document.getElementById('trimEnd').value.trim();
            let trimRange = null;

            if (startVal || endVal) {
                trimRange = (startVal || "0:00") + '-' + (endVal || "");
            }

            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const payload = {
                trim: trimRange,
                quality: currentQuality,
                caption: document.getElementById('captionText').value.trim(),
                delogo: currentDelogo
            };

            if (tg) {
                tg.sendData(JSON.stringify(payload));
                tg.close();
            } else {
                alert("Данные для отправки:\n" + JSON.stringify(payload, null, 2));
            }
        }
    </script>
</body>
</html>
